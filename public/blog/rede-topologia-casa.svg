<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Topologia de rede de uma casa conectada bem projetada</title>
  <desc id="d">Da entrada da operadora ao rack central, com roteador e switch PoE, saem cabos para pontos de acesso Wi-Fi, câmeras, gateway de automação e pontos fixos. A rede é segmentada em quatro VLANs: casa, automação, câmeras e visitantes.</desc>

  <defs>
    <style>
      .bg{fill:#070D18}
      .hd{font-family:Poppins,Arial,sans-serif;font-weight:700;font-size:26px;fill:#E8EDF5}
      .cap{font-family:Poppins,Arial,sans-serif;font-weight:500;font-size:13px;fill:#6F82A0}
      .box{fill:#122038;stroke:#2A3D5C;stroke-width:1.5}
      .node{fill:#0F1B30;stroke:#3A5478;stroke-width:1.5}
      .lbl{font-family:Poppins,Arial,sans-serif;font-weight:600;font-size:13px;fill:#C7D4E6}
      .sm{font-family:Poppins,Arial,sans-serif;font-weight:500;font-size:11px;fill:#7C8FAC}
      .rack{font-family:Poppins,Arial,sans-serif;font-weight:700;font-size:12px;fill:#E8EDF5;letter-spacing:.08em}
      .vl{font-family:Poppins,Arial,sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em}
      .link{fill:none;stroke:#E85A1A;stroke-width:2.2;stroke-linecap:round}
      .wifi{fill:none;stroke:#4FA3E3;stroke-width:1.6;opacity:.8}
    </style>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text class="hd" x="60" y="56">A rede é o projeto. O resto é consequência.</text>
  <text class="cap" x="60" y="82">Roteador de operadora no corredor não é rede. É um ponto único de falha com Wi-Fi.</text>

  <!-- WAN -->
  <rect class="node" x="60" y="300" width="130" height="60" rx="8"/>
  <text class="lbl" x="125" y="326" text-anchor="middle">Operadora</text>
  <text class="sm" x="125" y="345" text-anchor="middle">fibra / entrada</text>
  <path class="link" d="M190 330 L 250 330"/>

  <!-- RACK -->
  <rect class="box" x="250" y="180" width="200" height="300" rx="12"/>
  <text class="rack" x="350" y="210" text-anchor="middle">RACK CENTRAL</text>
  <line x1="270" y1="224" x2="430" y2="224" stroke="#2A3D5C" stroke-width="1"/>

  <rect class="node" x="270" y="240" width="160" height="52" rx="7"/>
  <text class="lbl" x="350" y="262" text-anchor="middle">Roteador</text>
  <text class="sm" x="350" y="280" text-anchor="middle">firewall + VLANs</text>

  <rect class="node" x="270" y="304" width="160" height="52" rx="7"/>
  <text class="lbl" x="350" y="326" text-anchor="middle">Switch PoE</text>
  <text class="sm" x="350" y="344" text-anchor="middle">alimenta e conecta</text>

  <rect class="node" x="270" y="368" width="160" height="52" rx="7"/>
  <text class="lbl" x="350" y="390" text-anchor="middle">Gravador (NVR)</text>
  <text class="sm" x="350" y="408" text-anchor="middle">armazenamento local</text>

  <rect class="node" x="270" y="432" width="160" height="36" rx="7"/>
  <text class="lbl" x="350" y="455" text-anchor="middle">Nobreak</text>

  <!-- fan out -->
  <path class="link" d="M450 330 C 520 330, 520 130, 610 130"/>
  <path class="link" d="M450 330 C 520 330, 520 230, 610 230"/>
  <path class="link" d="M450 330 C 520 330, 520 330, 610 330"/>
  <path class="link" d="M450 330 C 520 330, 520 430, 610 430"/>
  <path class="link" d="M450 330 C 520 330, 520 530, 610 530"/>

  <!-- endpoints -->
  <g>
    <rect class="node" x="610" y="104" width="230" height="52" rx="8"/>
    <text class="lbl" x="632" y="126">Ponto de acesso — térreo</text>
    <text class="sm" x="632" y="144">cabo, no teto, não na estante</text>
    <g class="wifi"><path d="M856 118 a 24 24 0 0 1 0 24"/><path d="M868 108 a 38 38 0 0 1 0 44"/></g>
  </g>
  <g>
    <rect class="node" x="610" y="204" width="230" height="52" rx="8"/>
    <text class="lbl" x="632" y="226">Ponto de acesso — superior</text>
    <text class="sm" x="632" y="244">um por pavimento, no mínimo</text>
    <g class="wifi"><path d="M856 218 a 24 24 0 0 1 0 24"/><path d="M868 208 a 38 38 0 0 1 0 44"/></g>
  </g>
  <g>
    <rect class="node" x="610" y="304" width="230" height="52" rx="8"/>
    <text class="lbl" x="632" y="326">Câmeras PoE</text>
    <text class="sm" x="632" y="344">energia e dados no mesmo cabo</text>
  </g>
  <g>
    <rect class="node" x="610" y="404" width="230" height="52" rx="8"/>
    <text class="lbl" x="632" y="426">Gateway de automação</text>
    <text class="sm" x="632" y="444">cabeado, sempre</text>
  </g>
  <g>
    <rect class="node" x="610" y="504" width="230" height="52" rx="8"/>
    <text class="lbl" x="632" y="526">Pontos fixos RJ45</text>
    <text class="sm" x="632" y="544">TV, escritório, som, videoporteiro</text>
  </g>

  <!-- VLAN rail -->
  <line x1="920" y1="104" x2="920" y2="556" stroke="#1B2942" stroke-width="1.5"/>
  <text class="cap" x="950" y="98">Segmentação</text>

  <g>
    <rect x="950" y="112" width="190" height="44" rx="8" fill="#0F1B30" stroke="#4FA3E3" stroke-width="1.4"/>
    <text class="vl" x="968" y="132" fill="#4FA3E3">VLAN CASA</text>
    <text class="sm" x="968" y="148">celular, notebook, TV</text>
  </g>
  <g>
    <rect x="950" y="212" width="190" height="44" rx="8" fill="#0F1B30" stroke="#E85A1A" stroke-width="1.4"/>
    <text class="vl" x="968" y="232" fill="#E85A1A">VLAN AUTOMAÇÃO</text>
    <text class="sm" x="968" y="248">módulos e gateway</text>
  </g>
  <g>
    <rect x="950" y="312" width="190" height="44" rx="8" fill="#0F1B30" stroke="#C22B2B" stroke-width="1.4"/>
    <text class="vl" x="968" y="332" fill="#C22B2B">VLAN CFTV</text>
    <text class="sm" x="968" y="348">isolada da internet</text>
  </g>
  <g>
    <rect x="950" y="412" width="190" height="44" rx="8" fill="#0F1B30" stroke="#7C8FAC" stroke-width="1.4"/>
    <text class="vl" x="968" y="432" fill="#9FB2CB">VLAN VISITANTE</text>
    <text class="sm" x="968" y="448">sem acesso ao resto</text>
  </g>

  <rect x="950" y="498" width="190" height="72" rx="8" fill="#0C1526" stroke="#1B2942" stroke-width="1.4"/>
  <text class="sm" x="968" y="522">Segmentar não é luxo. É evitar</text>
  <text class="sm" x="968" y="538">que um dispositivo barato vire</text>
  <text class="sm" x="968" y="554">porta de entrada pra casa toda.</text>

  <text class="cap" x="60" y="632">Cabo PoE resolve energia e dados de uma vez. Cada ponto de acesso e cada câmera puxados do rack — nunca em cascata de repetidor.</text>
</svg>
