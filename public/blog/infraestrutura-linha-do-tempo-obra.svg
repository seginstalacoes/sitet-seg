<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">Linha do tempo da obra e o custo de decidir a automação em cada fase</title>
  <desc id="d">Seis fases da obra, da fundação à mudança. A janela de decisão barata vai da estrutura à alvenaria. A partir do reboco, o custo de incluir automação cabeada sobe abruptamente até se tornar proibitivo depois do acabamento.</desc>

  <defs>
    <style>
      .bg{fill:#070D18}
      .hd{font-family:Poppins,Arial,sans-serif;font-weight:700;font-size:26px;fill:#E8EDF5}
      .cap{font-family:Poppins,Arial,sans-serif;font-weight:500;font-size:13px;fill:#6F82A0}
      .ph{font-family:Poppins,Arial,sans-serif;font-weight:700;font-size:14px;fill:#E8EDF5}
      .pd{font-family:Poppins,Arial,sans-serif;font-weight:500;font-size:12px;fill:#8DA0BC}
      .zn{font-family:Poppins,Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em}
      .axl{font-family:Poppins,Arial,sans-serif;font-weight:600;font-size:12px;fill:#5E7290;letter-spacing:.12em}
    </style>
    <linearGradient id="cost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FA96B" stop-opacity=".7"/>
      <stop offset="0.42" stop-color="#3FA96B" stop-opacity=".7"/>
      <stop offset="0.55" stop-color="#E8A11A" stop-opacity=".8"/>
      <stop offset="0.75" stop-color="#E85A1A" stop-opacity=".9"/>
      <stop offset="1" stop-color="#C22B2B" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA96B" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3FA96B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C22B2B" stop-opacity=".16"/>
      <stop offset="1" stop-color="#C22B2B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1200" height="640"/>
  <text class="hd" x="60" y="58">A automação se decide na alvenaria, não na loja</text>
  <text class="cap" x="60" y="84">O que custa um cabo hoje custa uma parede depois. A linha vermelha é a mesma decisão, tomada tarde.</text>

  <!-- zones -->
  <rect x="60" y="120" width="510" height="300" fill="url(#safe)"/>
  <rect x="700" y="120" width="440" height="300" fill="url(#danger)"/>
  <text class="zn" x="80" y="146" fill="#3FA96B">JANELA BARATA</text>
  <text class="zn" x="720" y="146" fill="#C22B2B">JANELA CARA</text>

  <!-- cost curve -->
  <path d="M80 400 L 340 398 L 500 392 L 620 350 L 780 250 L 940 178 L 1120 150"
        fill="none" stroke="url(#cost)" stroke-width="4" stroke-linecap="round"/>
  <text class="axl" x="46" y="290" transform="rotate(-90 46 290)" text-anchor="middle">CUSTO DE INCLUIR</text>

  <!-- baseline -->
  <line x1="60" y1="440" x2="1140" y2="440" stroke="#2A3D5C" stroke-width="2"/>

  <!-- phase markers -->
  <g>
    <circle cx="120" cy="440" r="6" fill="#3FA96B"/>
    <line x1="120" y1="440" x2="120" y2="470" stroke="#1B2942" stroke-width="1.5"/>
    <text class="ph" x="120" y="494" text-anchor="middle">Projeto</text>
    <text class="pd" x="120" y="514" text-anchor="middle">Decida aqui.</text>
    <text class="pd" x="120" y="530" text-anchor="middle">Custo: zero.</text>
  </g>
  <g>
    <circle cx="310" cy="440" r="6" fill="#3FA96B"/>
    <line x1="310" y1="440" x2="310" y2="470" stroke="#1B2942" stroke-width="1.5"/>
    <text class="ph" x="310" y="494" text-anchor="middle">Estrutura</text>
    <text class="pd" x="310" y="514" text-anchor="middle">Prumadas e</text>
    <text class="pd" x="310" y="530" text-anchor="middle">passagens de laje</text>
  </g>
  <g>
    <circle cx="500" cy="440" r="8" fill="#E85A1A" stroke="#070D18" stroke-width="3"/>
    <line x1="500" y1="440" x2="500" y2="470" stroke="#E85A1A" stroke-width="1.5"/>
    <text class="ph" x="500" y="494" text-anchor="middle" fill="#E85A1A">Alvenaria</text>
    <text class="pd" x="500" y="514" text-anchor="middle">Última chance real:</text>
    <text class="pd" x="500" y="530" text-anchor="middle">eletroduto e caixa</text>
  </g>
  <g>
    <circle cx="700" cy="440" r="6" fill="#E8A11A"/>
    <line x1="700" y1="440" x2="700" y2="470" stroke="#1B2942" stroke-width="1.5"/>
    <text class="ph" x="700" y="494" text-anchor="middle">Reboco</text>
    <text class="pd" x="700" y="514" text-anchor="middle">Fechou. A partir</text>
    <text class="pd" x="700" y="530" text-anchor="middle">daqui, é quebrar.</text>
  </g>
  <g>
    <circle cx="900" cy="440" r="6" fill="#E85A1A"/>
    <line x1="900" y1="440" x2="900" y2="470" stroke="#1B2942" stroke-width="1.5"/>
    <text class="ph" x="900" y="494" text-anchor="middle">Acabamento</text>
    <text class="pd" x="900" y="514" text-anchor="middle">Sobrou só o que</text>
    <text class="pd" x="900" y="530" text-anchor="middle">é sem fio</text>
  </g>
  <g>
    <circle cx="1090" cy="440" r="6" fill="#C22B2B"/>
    <line x1="1090" y1="440" x2="1090" y2="470" stroke="#1B2942" stroke-width="1.5"/>
    <text class="ph" x="1090" y="494" text-anchor="middle">Mudança</text>
    <text class="pd" x="1090" y="514" text-anchor="middle">Obra dentro de</text>
    <text class="pd" x="1090" y="530" text-anchor="middle">casa habitada</text>
  </g>

  <!-- annotation -->
  <rect x="60" y="562" width="1080" height="46" rx="10" fill="#0C1526" stroke="#1B2942" stroke-width="1.5"/>
  <text class="pd" x="84" y="591">Regra prática: eletroduto vazio e caixa de passagem são o item mais barato da obra e a única coisa que compra tempo. Deixe, mesmo que não vá usar agora.</text>
</svg>
